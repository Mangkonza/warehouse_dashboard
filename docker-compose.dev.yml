# Local development database compose
# Usage: docker compose -f docker-compose.dev.yml up -d
services:
  postgres:
    image: postgres:16-alpine
    container_name: ku_warehouse_db_dev
    restart: unless-stopped
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-ku_warehouse}"
      POSTGRES_USER: "${POSTGRES_USER:-ku_owner}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-change_this_to_owner_password}"
      APP_USER: "${APP_USER:-ku_app}"
      APP_PASSWORD: "${APP_PASSWORD:-change_this_to_app_password}"
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - pgdata_dev:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-ku_owner} -d $${POSTGRES_DB:-ku_warehouse}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata_dev:
    name: ku_warehouse_pgdata_dev
