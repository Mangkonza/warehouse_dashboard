services:
  postgres:
    image: postgres:16
    container_name: ku_warehouse_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ku_admin
      POSTGRES_PASSWORD: ku_warehouse_secret_2026
      POSTGRES_DB: ku_warehouse
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ku_admin -d ku_warehouse"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
    driver: local
