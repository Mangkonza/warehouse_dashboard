services:
  postgres:
    image: postgres:16-alpine
    container_name: ku_warehouse_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-ku_warehouse}"
      POSTGRES_USER: "${POSTGRES_USER:-ku_owner}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}"
      APP_USER: "${APP_USER:-ku_app}"
      APP_PASSWORD: "${APP_PASSWORD:?APP_PASSWORD must be set in .env}"
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ku_owner} -d ${POSTGRES_DB:-ku_warehouse}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
    name: ku_warehouse_pgdata
