services:
  db:
    image: postgres:16-alpine
    container_name: ku_warehouse_db
    restart: unless-stopped
    env_file:
      - .env.db
    ports:
      - "127.0.0.1:5432:5432"
    expose:
      - "5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-ku_owner} -d $${POSTGRES_DB:-ku_warehouse}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - internal

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: ku-warehouse-backend:latest
    container_name: ku_warehouse_backend
    restart: unless-stopped
    env_file:
      - .env.backend
    expose:
      - "8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8000/api/v1/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - internal

  frontend:
    build:
      context: ./warehouse_dashboard
      dockerfile: Dockerfile
      args:
        BASE_PATH: ${BASE_PATH:-}
        BACKEND_URL: ${BACKEND_URL:-http://backend:8000}
    image: ku-warehouse-frontend:latest
    container_name: ku_warehouse_frontend
    restart: unless-stopped
    deploy:
      replicas: 1 # Exactly 1 replica: roleCache is in-process (multiple replicas cause cache staleness)
    env_file:
      - .env.frontend
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000' + (process.env.BASE_PATH || '') + '/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - internal

volumes:
  pgdata:
    name: ku_warehouse_pgdata

networks:
  internal:
    driver: bridge
