$kind: http-request
description: ต้องมี boolean active=true หรือ authenticated=true เพื่อให้ผ่าน authGuard
url: "{{verifyUrl}}"
method: GET
headers:
  Accept: application/json
auth:
  type: bearer
  credentials:
    token: "{{accessToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("HTTP 2xx", () => pm.expect(pm.response.code).to.be.within(200,299));
      pm.test("ALL LOGIN is active", () => { const d=pm.response.json(); pm.expect(d.active===true || d.authenticated===true).to.eql(true); });
    language: text/javascript
order: 3000
